name: bearing-catalog-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bearing
      POSTGRES_PASSWORD: bearing
      POSTGRES_DB: bearing_shop
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bearing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bearing -d bearing_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bearing_postgres_data:
