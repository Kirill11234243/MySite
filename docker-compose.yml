services:
  postgres:
    image: postgres:16-alpine
    container_name: bearing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bearing
      POSTGRES_PASSWORD: bearing
      POSTGRES_DB: bearing_shop
    ports:
      - "5432:5432"
    volumes:
      - bearing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bearing -d bearing_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: bearing-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: local-dev-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - bearing_meili_data:/meili_data

volumes:
  bearing_postgres_data:
  bearing_meili_data:
