services:
  - type: web
    name: podsh-ul
    runtime: node
    region: frankfurt
    plan: free
    branch: bearing-shop-mvp
    buildCommand: npm ci && npm run build -w @bearing/web
    startCommand: npm run start -w @bearing/web
    healthCheckPath: /contacts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_HOST
        fromService:
          name: podsh-ul
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
